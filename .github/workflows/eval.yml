name: Eval

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      live_recipes:
        description: "Run live LLM recipes (needs OPENAI_API_KEY secret)"
        type: boolean
        default: false

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest tests -q
      - name: Recipe list + dry-run
        run: |
          python calvis.py ls
          python calvis.py t cl -n
          python calvis.py t ag -n
          python calvis.py go -n --files scheduled_check_in.md
          python calvis.py why vb -n

  live-smoke:
    name: Live recipe smoke (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_recipes }}
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Welcome smoke (wl)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret not set; skip live recipes"
            exit 0
          fi
          python calvis.py t wl
      - name: Upload recipe scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-scores
          path: runs/**/recipe_score.json
          if-no-files-found: ignore
